<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf7f4">
<title>每日壁纸库 · 免费领取</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>每日壁纸库 · 免费领取</h1>
  <p class="sub">全部免费送 · 每天更新 · 手机壁纸 1290×2796<br>点开大图,一键保存原图</p>
</header>
<nav id="tabs" class="tabs" aria-label="分组导航"></nav>
<main id="list"></main>
<footer>
  <p>本站壁纸均为AI生成,仅限个人使用,不可转售</p>
</footer>

<div id="viewer" class="viewer" hidden>
  <div class="vtop"><span id="vcount"></span><button id="vclose" aria-label="关闭">✕</button></div>
  <div id="track" class="track"></div>
  <div class="vbottom">
    <div id="vtitle" class="vtitle"></div>
    <a id="vsave" class="save" download>保存原图</a>
    <div class="tip">若没有自动保存,请长按图片,选择“存储到相册”</div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
